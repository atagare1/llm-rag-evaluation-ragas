[pytest]
testpaths = .
pythonpath = src
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# DeepEval 2.7.0 registers a pytest plugin that imports optional providers
# (google.genai, ollama, llama-index). Disable it so the suite does not
# require those extras or upgrade the frozen RAGAS stack.
addopts = -p no:deepeval
